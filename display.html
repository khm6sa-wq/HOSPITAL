<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكرتي وشاشة العرض - مستشفى الملك فيصل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hospital: {
                            blue: '#0F3759',      
                            darkBlue: '#0A253D',  
                            lightBlue: '#1E4D7B', 
                            accent: '#D4AF37',    
                            sand: '#F7F9FC',      
                        }
                    },
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F4F7FB;
            overflow-x: hidden;
        }
        .pattern-bg {
            background-color: #F4F7FB;
            background-image: radial-gradient(#1E4D7B 0.6px, transparent 0.6px), radial-gradient(#D4AF37 0.6px, #F4F7FB 0.6px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(15, 55, 89, 0.12);
        }
        .royal-glow {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="pattern-bg text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-hospital-blue text-white border-b-4 border-hospital-accent shadow-2xl py-4 px-6 text-center">
        <h1 class="text-3xl font-bold font-amiri text-amber-200">مُسْتَشْفَى المَلِك فَيْصَل</h1>
        <p class="text-xs text-slate-200 mt-1">نظام إدارة الطوابير الذكي - بطاقة المراجع</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center space-y-6">
        
        <!-- Visitor Ticket Card -->
        <div class="bg-white rounded-3xl p-6 border-4 border-hospital-accent/50 card-shadow text-center space-y-5">
            <div class="text-slate-500 font-bold text-sm">رقم تذكرتك الذكية</div>
            
            <div id="my-ticket-num" class="text-8xl font-black text-hospital-blue tracking-tighter py-4 bg-hospital-sand rounded-3xl border-2 border-hospital-accent/30 shadow-inner">
                ---
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-hospital-sand p-3 rounded-2xl border border-hospital-accent/30">
                    <div class="text-[11px] text-slate-500 font-bold">الرقم الحالي بالخدمة</div>
                    <div id="display-current" class="text-3xl font-black text-hospital-blue mt-1">---</div>
                </div>
                <div class="bg-hospital-sand p-3 rounded-2xl border border-hospital-accent/30">
                    <div class="text-[11px] text-slate-500 font-bold">المراجعين قبلك</div>
                    <div id="display-ahead" class="text-3xl font-black text-hospital-accent mt-1">0</div>
                </div>
            </div>

            <div id="status-box" class="bg-hospital-blue text-amber-200 p-4 rounded-2xl text-xs font-black shadow-md">
                جاري الاتصال بالنظام وحجز تذكرتك...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-hospital-darkBlue text-amber-200 py-3 text-center text-xs font-bold shadow-lg">
        <p>وزارة الصحة © المملكة العربية السعودية</p>
    </footer>

    <!-- Firebase Sync & Auto Booking Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtLu7ICGKWJDHIuPBM4h1cZmkDsxjylxo",
            authDomain: "hospital-ba989.firebaseapp.com",
            projectId: "hospital-ba989",
            storageBucket: "hospital-ba989.firebasestorage.app",
            messagingSenderId: "30608387919",
            appId: "1:30608387919:web:ee0f83efabc514e5ff1f3a",
            measurementId: "G-6R34PWFVWK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        signInAnonymously(auth).catch(() => {});

        const docRef = doc(db, "queues", "hospital_main_queue");
        
        let myTicketId = localStorage.getItem('kfh_my_ticket');
        let state = { queue: [], current: null, nextId: 1 };

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const cloudData = docSnap.data();
                if (cloudData && cloudData.state) {
                    state = cloudData.state;

                    // إذا لم يكن لدى هذا الهاتف تذكرة مخزنة، يتم حجز رقم جديد له تلقائياً فور فتح الرابط
                    if (!myTicketId) {
                        myTicketId = state.nextId;
                        state.queue.push({ id: Number(myTicketId), time: Date.now() });
                        state.nextId++;
                        localStorage.setItem('kfh_my_ticket', myTicketId);
                        setDoc(docRef, { state, timestamp: Date.now() }).catch(() => {});
                    }

                    updateVisitorUI();
                }
            }
        }, () => {});

        function updateVisitorUI() {
            try {
                const myTicketEl = document.getElementById('my-ticket-num');
                const currentEl = document.getElementById('display-current');
                const aheadEl = document.getElementById('display-ahead');
                const statusBox = document.getElementById('status-box');

                if (myTicketEl) myTicketEl.textContent = String(myTicketId).padStart(3, '0');

                const currentStr = (state && state.current && state.current.id) ? String(state.current.id).padStart(3, '0') : '---';
                if (currentEl) currentEl.textContent = currentStr;

                let aheadCount = 0;
                if (state && state.queue) {
                    const index = state.queue.findIndex(p => String(p.id) === String(myTicketId));
                    if (index !== -1) {
                        aheadCount = index;
                    } else if (state.current && Number(myTicketId) < Number(state.current.id)) {
                        aheadCount = -1; // تمت خدمته
                    } else {
                        aheadCount = state.queue.length;
                    }
                }
                if (aheadEl) aheadEl.textContent = aheadCount >= 0 ? aheadCount : 0;

                if (state.current && String(state.current.id) === String(myTicketId)) {
                    if (statusBox) {
                        statusBox.innerHTML = '<i class="fa-solid fa-bell ml-2"></i> دورك الآن! يرجى التوجه للعيادة فوراً';
                        statusBox.className = 'bg-amber-400 text-hospital-darkBlue p-4 rounded-2xl text-sm font-black shadow-md animate-pulse';
                    }
                } else if (aheadCount === 0) {
                    if (statusBox) {
                        statusBox.textContent = 'أنت التالي في الدور! استعد للخدمة.';
                        statusBox.className = 'bg-hospital-lightBlue text-white p-4 rounded-2xl text-xs font-bold shadow-md';
                    }
                } else if (aheadCount < 0) {
                    if (statusBox) {
                        statusBox.textContent = 'تمت خدمة تذكرتك مسبقاً. نتمنى لك السلامة.';
                        statusBox.className = 'bg-slate-600 text-white p-4 rounded-2xl text-xs font-bold shadow-md';
                    }
                } else {
                    if (statusBox) {
                        statusBox.textContent = `تم حجز تذكرتك بنجاح. يوجد ${aheadCount} مراجعين قبلك في الانتظار.`;
                        statusBox.className = 'bg-hospital-blue text-amber-200 p-4 rounded-2xl text-xs font-bold shadow-md';
                    }
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
