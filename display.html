<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الانتظار - مستشفى الملك فيصل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hospital: {
                            blue: '#0F3759',      
                            darkBlue: '#0A253D',  
                            lightBlue: '#1E4D7B', 
                            accent: '#D4AF37',    
                            sand: '#F7F9FC',      
                        }
                    },
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F4F7FB;
            overflow-x: hidden;
        }
        .pattern-bg {
            background-color: #F4F7FB;
            background-image: radial-gradient(#1E4D7B 0.6px, transparent 0.6px), radial-gradient(#D4AF37 0.6px, #F4F7FB 0.6px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(15, 55, 89, 0.12);
        }
        .royal-crest-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(15, 55, 89, 0.1);
        }
        .call-flash {
            animation: flashGold 1s ease-in-out 3;
        }
        @keyframes flashGold {
            0%, 100% { background-color: rgba(255, 255, 255, 1); }
            50% { background-color: rgba(254, 243, 199, 0.8); }
        }
    </style>
</head>
<body class="pattern-bg text-slate-800 min-h-screen flex flex-col justify-between" onclick="initAudioContext()">

    <!-- Top Bar -->
    <div class="bg-hospital-darkBlue py-2 px-6 text-xs font-bold text-amber-200 border-b border-hospital-accent/30 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5 text-hospital-accent">
                <i class="fa-solid fa-hospital text-sm"></i>
                <span class="tracking-wide">المملكة العربية السعودية - وزارة الصحة</span>
            </div>
            <div class="flex items-center gap-2 font-black text-hospital-accent bg-hospital-accent/10 px-3 py-0.5 rounded-full border border-hospital-accent/30">
                <i class="fa-solid fa-gem text-[11px]"></i>
                <span>رؤية 2030</span>
            </div>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="bg-hospital-blue text-white border-b-4 border-hospital-accent shadow-2xl py-3 px-8 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <!-- الشعار الرسمي محدد بدائرة ملكية مذهبة ناصعة وواضحة جداً -->
            <div class="flex items-center space-x-5 space-x-reverse">
                <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-white p-1 border-4 border-hospital-accent royal-crest-glow shrink-0 flex items-center justify-center overflow-hidden shadow-2xl">
                    <img src="logo.png" alt="شعار مستشفى الملك فيصل" class="w-full h-full object-contain transform scale-110">
                </div>

                <div class="flex flex-col justify-center">
                    <h1 class="text-3xl sm:text-4xl font-bold font-amiri tracking-tight text-white drop-shadow-md">
                        مُسْتَشْفَى المَلِك فَيْصَل
                    </h1>
                    <span class="text-sm sm:text-base font-semibold tracking-wider text-amber-200 mt-0.5">
                        King Faisal Hospital
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleFullScreen()" class="bg-hospital-accent hover:bg-amber-400 text-hospital-darkBlue px-4.5 py-3 rounded-2xl text-xs font-black shadow-lg transition-all transform hover:scale-105 flex items-center gap-2 cursor-pointer border border-white/30">
                    <i class="fa-solid fa-expand text-base"></i>
                    <span class="hidden sm:inline">تكبير الشاشة</span>
                </button>

                <div class="text-left bg-hospital-darkBlue px-6 py-2.5 rounded-2xl border border-hospital-accent/40 min-w-[160px] shadow-inner">
                    <div id="live-clock" class="text-xl sm:text-2xl font-black text-hospital-accent tracking-widest text-center">00:00:00 ص</div>
                    <div id="live-date" class="text-[10px] text-amber-200 font-bold mt-0.5 text-center">--/--/----</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Display Area -->
    <main class="max-w-5xl w-full mx-auto px-6 py-8 flex-grow flex flex-col gap-8 justify-center">

        <!-- Current Serving Display Box -->
        <div id="lounge-card-container" class="bg-white rounded-3xl p-10 border-4 border-hospital-accent/50 card-shadow text-center space-y-6 relative overflow-hidden transition-all duration-300">
            <div class="absolute top-0 right-0 left-0 h-3 bg-gradient-to-r from-hospital-blue via-hospital-accent to-hospital-blue"></div>
            
            <div class="text-slate-600 font-black text-2xl sm:text-3xl mb-2 flex items-center justify-center gap-3">
                <i class="fa-solid fa-bell text-hospital-accent animate-bounce"></i>
                <span>الرقم الحالي</span>
            </div>

            <div class="py-2">
                <div id="display-current-num" class="text-9xl sm:text-[11rem] font-black text-hospital-blue tracking-tighter my-2 py-6 bg-hospital-sand rounded-3xl border-2 border-hospital-accent/30 shadow-inner">---</div>
            </div>

            <div class="bg-hospital-blue text-amber-200 p-4 rounded-2xl border border-hospital-accent/50 text-xl sm:text-2xl font-black shadow-md flex items-center justify-center gap-3 max-w-xl mx-auto">
                <i class="fa-solid fa-stethoscope text-hospital-accent"></i>
                <span>الرجاء التوجه للعيادة</span>
            </div>
        </div>

        <!-- Next Queue List Boxes -->
        <div class="bg-white rounded-3xl p-6 border-2 border-slate-200/80 card-shadow space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-full bg-hospital-accent"></div>
                    <h2 class="text-lg font-black text-hospital-darkBlue">قائمة الانتظار القادمة</h2>
                </div>
                <span id="display-queue-counter" class="text-xs font-bold text-hospital-blue bg-hospital-blue/10 border border-hospital-blue/20 px-3 py-1 rounded-full">0 مراجعين</span>
            </div>

            <div id="display-queue-list" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4">
            </div>

            <div id="display-empty-msg" class="text-center py-8 text-slate-400 font-bold hidden">
                <i class="fa-solid fa-clipboard-check text-3xl text-slate-300 mb-2 block"></i>
                لا يوجد مراجعين في الانتظار حالياً
            </div>
        </div>

    </main>

    <!-- Footer Banner -->
    <footer class="bg-hospital-darkBlue text-amber-200 py-4 border-t border-hospital-accent/30 text-center text-sm font-bold shadow-lg">
        <p>نعمل لخدمتكم دائماً - وزارة الصحة © المملكة العربية السعودية</p>
    </footer>

    <!-- Audio & Firebase Sync Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let audioCtx = null;

        window.initAudioContext = function() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
        };

        let state = {
            queue: [],
            current: null
        };

        let lastAnnouncedId = null;

        // Live Clock (12-Hour format with AM/PM)
        setInterval(() => {
            const now = new Date();
            const clockEl = document.getElementById('live-clock');
            const dateEl = document.getElementById('live-date');
            
            if(clockEl) {
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'م' : 'ص';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const formattedHours = String(hours).padStart(2, '0');
                clockEl.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }

            if(dateEl) {
                dateEl.textContent = now.toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }
        }, 1000);

        try {
            const localSaved = localStorage.getItem('kfh_queue_state');
            if (localSaved) {
                const parsed = JSON.parse(localSaved);
                if (parsed && parsed.state) {
                    state = parsed.state;
                    if(state.current) lastAnnouncedId = state.current.id;
                }
            }
        } catch (e) {}

        const firebaseConfig = {
            apiKey: "AIzaSyBtLu7ICGKWJDHIuPBM4h1cZmkDsxjylxo",
            authDomain: "hospital-ba989.firebaseapp.com",
            projectId: "hospital-ba989",
            storageBucket: "hospital-ba989.firebasestorage.app",
            messagingSenderId: "30608387919",
            appId: "1:30608387919:web:ee0f83efabc514e5ff1f3a",
            measurementId: "G-6R34PWFVWK"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);
            signInAnonymously(auth).catch(() => {});

            const docRef = doc(db, "queues", "hospital_main_queue");
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (cloudData && cloudData.state) {
                        state = cloudData.state;
                        const shouldAnnounce = cloudData.shouldAnnounce;

                        if (state.current && state.current.id !== lastAnnouncedId) {
                            lastAnnouncedId = state.current.id;
                            playChimeOnly();
                            flashLoungeDisplay();
                        } else if (shouldAnnounce && state.current && state.current.id === lastAnnouncedId) {
                            playChimeOnly();
                            flashLoungeDisplay();
                        }

                        renderDisplay();
                    }
                }
            }, () => {});
        } catch (e) {}

        const queueChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('kfh_queue_sync') : null;
        if (queueChannel) {
            queueChannel.onmessage = (event) => {
                if (event.data && event.data.state) {
                    state = event.data.state;
                    const shouldAnnounce = event.data.shouldAnnounce;

                    if (state.current && (state.current.id !== lastAnnouncedId || shouldAnnounce)) {
                        lastAnnouncedId = state.current.id;
                        playChimeOnly();
                        flashLoungeDisplay();
                    }

                    renderDisplay();
                }
            };
        }

        function playChimeOnly() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const freqs = [659.25, 880, 1318.51];
                freqs.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.15));
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + (idx * 0.15));
                    gain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + (idx * 0.15) + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.15) + 0.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.15));
                    osc.stop(audioCtx.currentTime + (idx * 0.15) + 0.8);
                });
            } catch (e) {}
        }

        function flashLoungeDisplay() {
            const loungeCard = document.getElementById('lounge-card-container');
            if (loungeCard) {
                loungeCard.classList.add('call-flash');
                setTimeout(() => loungeCard.classList.remove('call-flash'), 3000);
            }
        }

        function renderDisplay() {
            const currentNumEl = document.getElementById('display-current-num');
            const queueListEl = document.getElementById('display-queue-list');
            const queueCounterEl = document.getElementById('display-queue-counter');
            const emptyMsgEl = document.getElementById('display-empty-msg');

            const currentStr = state.current ? String(state.current.id).padStart(3, '0') : '---';
            if (currentNumEl) currentNumEl.textContent = currentStr;
            if (queueCounterEl) queueCounterEl.textContent = `${state.queue.length} مراجعين`;

            if (queueListEl) {
                queueListEl.innerHTML = '';
                if (state.queue.length === 0) {
                    if (emptyMsgEl) emptyMsgEl.classList.remove('hidden');
                } else {
                    if (emptyMsgEl) emptyMsgEl.classList.add('hidden');
                    state.queue.forEach((patient) => {
                        const box = document.createElement('div');
                        box.className = "bg-hospital-sand border-2 border-hospital-accent/40 rounded-2xl p-4 text-center shadow-sm flex flex-col items-center justify-center";
                        box.innerHTML = `
                            <span class="text-3xl sm:text-4xl font-black text-hospital-blue">${String(patient.id).padStart(3, '0')}</span>
                        `;
                        queueListEl.appendChild(box);
                    });
                }
            }
        }

        renderDisplay();
    </script>
</body>
</html>
