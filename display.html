<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض والانتظار - مستشفى الملك فيصل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hospital: {
                            blue: '#0F3759',      
                            darkBlue: '#0A253D',  
                            lightBlue: '#1E4D7B', 
                            accent: '#D4AF37',    
                            sand: '#F7F9FC',      
                        }
                    },
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F4F7FB;
            overflow-x: hidden;
        }
        .pattern-bg {
            background-color: #F4F7FB;
            background-image: radial-gradient(#1E4D7B 0.6px, transparent 0.6px), radial-gradient(#D4AF37 0.6px, #F4F7FB 0.6px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(15, 55, 89, 0.12);
        }
        .royal-glow {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="pattern-bg text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Top Bar -->
    <div class="bg-hospital-darkBlue py-2 px-6 text-xs font-bold text-amber-200 border-b border-hospital-accent/30 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5 text-hospital-accent">
                <i class="fa-solid fa-hospital text-sm"></i>
                <span class="tracking-wide">المملكة العربية السعودية - وزارة الصحة | شاشة العرض العامة</span>
            </div>
            <div class="flex items-center gap-2 font-black text-hospital-accent bg-hospital-accent/10 px-3 py-0.5 rounded-full border border-hospital-accent/30">
                <i class="fa-solid fa-gem text-[11px]"></i>
                <span>رؤية 2030</span>
            </div>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="bg-hospital-blue text-white border-b-4 border-hospital-accent shadow-2xl py-4 px-8 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <div class="flex items-center space-x-5 space-x-reverse">
                <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full border-2 border-hospital-accent shadow-2xl royal-glow shrink-0 flex items-center justify-center overflow-hidden bg-white">
                    <img src="logo.png" alt="شعار مستشفى الملك فيصل" class="w-full h-full object-cover scale-[1.55]">
                </div>

                <div class="flex flex-col justify-center">
                    <h1 class="text-3xl sm:text-4xl font-bold font-amiri tracking-tight text-white drop-shadow-md">
                        مُسْتَشْفَى المَلِك فَيْصَل
                    </h1>
                    <span class="text-sm sm:text-base font-semibold tracking-wider text-amber-200 mt-1">
                        King Faisal Hospital - شاشة الانتظار
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Fullscreen Toggle Button -->
                <button onclick="toggleFullscreen()" class="bg-hospital-accent hover:bg-amber-400 text-hospital-darkBlue px-4 py-3 rounded-2xl text-xs font-black shadow-lg transition-all transform hover:scale-105 flex items-center gap-2 cursor-pointer border border-white/30">
                    <i class="fa-solid fa-expand text-base"></i>
                    <span>تكبير الشاشة</span>
                </button>

                <div class="text-left bg-hospital-darkBlue px-6 py-2.5 rounded-2xl border border-hospital-accent/40 min-w-[160px] shadow-inner">
                    <div id="live-clock" class="text-xl sm:text-2xl font-black text-hospital-accent tracking-widest text-center">00:00:00 ص</div>
                    <div id="live-date" class="text-[10px] text-amber-200 font-bold mt-0.5 text-center">--/--/----</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Display Area -->
    <main class="max-w-4xl w-full mx-auto px-6 py-8 flex-grow flex flex-col space-y-6">

        <!-- Current Serving Box -->
        <div class="bg-white rounded-3xl p-8 sm:p-10 border-4 border-hospital-accent/50 card-shadow text-center space-y-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 left-0 h-3 bg-gradient-to-r from-hospital-blue via-hospital-accent to-hospital-blue"></div>
            
            <div class="text-hospital-darkBlue font-black text-2xl sm:text-3xl flex items-center justify-center gap-3">
                <i class="fa-solid fa-bullhorn text-hospital-accent animate-bounce text-3xl"></i>
                <span>الرقم الحالي تحت الخدمة</span>
            </div>
            
            <div id="display-current-num" class="text-8xl sm:text-[11rem] font-black text-hospital-blue tracking-tighter py-6 bg
