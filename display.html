<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الانتظار - مستشفى الملك فيصل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hospital: {
                            blue: '#0F3759',      
                            darkBlue: '#0A253D',  
                            lightBlue: '#1E4D7B', 
                            accent: '#D4AF37',    
                            sand: '#F7F9FC',      
                        }
                    },
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F4F7FB;
            overflow-x: hidden;
        }
        .pattern-bg {
            background-color: #F4F7FB;
            background-image: radial-gradient(#1E4D7B 0.6px, transparent 0.6px), radial-gradient(#D4AF37 0.6px, #F4F7FB 0.6px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(15, 55, 89, 0.12);
        }
        .royal-glow {
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
        }
        .call-flash {
            animation: flashGold 1s ease-in-out 3;
        }
        @keyframes flashGold {
            0%, 100% { background-color: rgba(255, 255, 255, 1); }
            50% { background-color: rgba(254, 243, 199, 0.8); }
        }
    </style>
</head>
<body class="pattern-bg text-slate-800 min-h-screen flex flex-col justify-between" onclick="initAudioContext()">

    <!-- Top Bar -->
    <div class="bg-hospital-darkBlue py-2 px-6 text-xs font-bold text-amber-200 border-b border-hospital-accent/30 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5 text-hospital-accent">
                <i class="fa-solid fa-hospital text-sm"></i>
                <span class="tracking-wide">المملكة العربية السعودية - وزارة الصحة</span>
            </div>
            <div class="flex items-center gap-2 font-black text-hospital-accent bg-hospital-accent/10 px-3 py-0.5 rounded-full border border-hospital-accent/30">
                <i class="fa-solid fa-gem text-[11px]"></i>
                <span>رؤية 2030</span>
            </div>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="bg-hospital-blue text-white border-b-4 border-hospital-accent shadow-2xl py-4 px-8 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <!-- الشعار بدون أي فراغات بيضاء وبدمج متناسق -->
            <div class="flex items-center space-x-5 space-x-reverse">
                <img src="logo.png" alt="شعار مستشفى الملك فيصل" class="w-24 h-24 sm:w-28 sm:h-28 object-contain mix-blend-multiply royal-glow shrink-0">

                <div class="flex flex-col justify-center">
                    <h1 class="text-3xl sm:text-4xl font-bold font-amiri tracking-tight text-white drop-shadow-md">
                        مُسْتَشْفَى المَلِك فَيْصَل
                    </h1>
                    <span class="text-sm sm:text-base font-semibold tracking-wider text-amber-200 mt-1">
                        King Faisal Hospital
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleFullScreen()" class="bg-hospital-accent hover:bg-amber-400 text-hospital-darkBlue px-4.5 py-3 rounded-2xl text-xs font-black shadow-lg transition-all transform hover:scale-105 flex items-center gap-2 cursor-pointer border border-white/30">
                    <i class="fa-solid fa-expand text-base"></i>
                    <span class="hidden sm:inline">تكبير الشاشة</span>
                </button>

                <div class="text-left bg-hospital-darkBlue px-6 py-2.5 rounded-2xl border border-hospital-accent/40 min-w-[160px] shadow-inner">
                    <div id="live-clock" class="text-xl sm:text-2xl font-black text-hospital-accent tracking-widest text-center">00:00:00 ص</div>
                    <div id="live-date" class="text-[10px] text-amber-200 font-bold mt-0.5 text-center">--/--/----</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Display Area -->
    <main class="max-w-5xl w-full mx-auto px-6 py-8 flex-grow flex flex-col gap-8 justify-center">

        <!-- Current Serving Display Box -->
        <div id="lounge-card-container" class="bg-white rounded-3xl p-10 border-4 border-hospital-accent/50 card-shadow text-center space-y-6 relative overflow-hidden transition-all duration-300">
            <div class="absolute top-0 right-0 left-0 h-3 bg-gradient-to-r from-hospital-blue via-hospital-accent to-hospital-blue"></div>
            
            <div class="text-slate-600 font-black text-2xl sm:text-3xl mb-2 flex items-center justify-center gap-3">
                <i class="fa-solid fa-bell text-hospital-accent animate-bounce"></i>
                <span>الرقم الحالي</span>
            </div>

            <div class="py-2">
                <div id="display-current-num" class="text-9xl sm:text-[11rem] font-black text-hospital-blue tracking-tighter my-2 py-6 bg-hospital-sand rounded-3xl border-2 border-hospital-accent/30 shadow-inner">---</div>
            </div>

            <div class="bg-hospital-blue text-amber-200 p-4 rounded-2xl border border-hospital-accent/50 text-xl sm:text-2xl font-black shadow-md flex items-center justify-center gap-3 max-w-xl mx-auto">
                <i class="fa-solid fa-stethoscope text-hospital-accent"></i>
                <span>الرجاء التوجه للعيادة</span>
            </div>
        </div>

        <!-- Next Queue List Boxes -->
        <div class="bg-white rounded-3xl p-6 border-2 border-slate-200/80 card-shadow space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-full bg-hospital-accent"></div>
                    <h2 class="text-lg font-black text-hospital-darkBlue">قائمة الانتظار القادمة</h2>
                </div>
                <span id="display-queue-counter" class="text-xs font-bold text-hospital-blue bg-hospital-blue/10 border border-hospital-blue/20 px-3 py-1 rounded-full">0 مراجعين</span>
            </div>

            <div id="display-queue-list" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4">
            </div>

            <div id="display-empty-msg" class="text-center py-8 text-slate-400 font-bold hidden">
                <i class="fa-solid fa-clipboard-check text-3xl text-slate-300 mb-2 block"></i>
                لا يوجد مراجعين في الانتظار حالياً
            </div>
        </div>

    </main>

    <!-- Footer Banner -->
    <footer class="bg-hospital-darkBlue text-amber-200 py-4 border-t border-hospital-accent/30 text-center text-sm font-bold shadow-lg">
        <p>نعمل لخدمتكم دائماً - وزارة الصحة © المملكة العربية السعودية</p>
    </footer>

    <!-- Audio & Firebase Sync Engine -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "
