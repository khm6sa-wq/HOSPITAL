<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الانتظار وعرض الأدوار - مستشفى الملك فيصل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hospital: {
                            blue: '#0F3759',      
                            darkBlue: '#0A253D',  
                            lightBlue: '#1E4D7B', 
                            accent: '#D4AF37',    
                            sand: '#F7F9FC',      
                        }
                    },
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0A253D;
            overflow: hidden;
        }
        .royal-glow {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="bg-hospital-darkBlue text-white h-screen flex flex-col justify-between p-6">

    <!-- Header -->
    <header class="bg-hospital-blue border-b-4 border-hospital-accent py-4 px-8 rounded-2xl shadow-2xl flex items-center justify-between">
        <div class="flex items-center space-x-4 space-x-reverse">
            <div class="w-16 h-16 rounded-full border-2 border-hospital-accent bg-white flex items-center justify-center overflow-hidden shadow-lg">
                <img src="logo.png" alt="شعار مستشفى الملك فيصل" class="w-full h-full object-cover scale-[1.55]">
            </div>
            <div>
                <h1 class="text-3xl font-bold font-amiri text-white tracking-wide">مُسْتَشْفَى المَلِك فَيْصَل</h1>
                <p class="text-xs text-amber-200 font-semibold">شاشة العرض والمتابعة العامة</p>
            </div>
        </div>

        <div class="text-left bg-hospital-darkBlue px-6 py-2.5 rounded-2xl border border-hospital-accent/40 shadow-inner">
            <div id="live-clock" class="text-2xl font-black text-hospital-accent tracking-widest text-center">00:00:00 ص</div>
            <div id="live-date" class="text-[10px] text-amber-200 font-bold text-center mt-0.5">--/--/----</div>
        </div>
    </header>

    <!-- Main Display Section -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6 my-auto flex-grow py-6">
        
        <!-- Current Serving Box (2 Columns) -->
        <div class="md:col-span-2 bg-hospital-blue border-4 border-hospital-accent/60 rounded-3xl p-8 flex flex-col items-center justify-center shadow-2xl royal-glow relative overflow-hidden text-center">
            <div class="absolute top-0 right-0 left-0 h-3 bg-gradient-to-r from-hospital-accent via-white to-hospital-accent"></div>
            
            <div class="text-amber-200 font-black text-2xl mb-4 flex items-center gap-3">
                <i class="fa-solid fa-bullhorn text-hospital-accent animate-bounce"></i>
                <span>الرقم الحالي تحت الخدمة</span>
            </div>

            <div id="display-current-num" class="text-9xl sm:text-[12rem] font-black text-white tracking-tighter drop-shadow-2xl my-2">
                000
            </div>

            <div class="text-sm text-slate-300 font-bold mt-2">
                يرجى من المراجع الكريم التوجه إلى العيادة المخصصة فوراً
            </div>
        </div>

        <!-- Waiting Queue List (1 Column) -->
        <div class="md:col-span-1 bg-hospital-blue/80 border-2 border-hospital-accent/30 rounded-3xl p-6 flex flex-col shadow-xl">
            <div class="flex items-center justify-between pb-3 border-b border-hospital-accent/30 mb-4">
                <h2 class="text-lg font-black text-amber-200 flex items-center gap-2">
                    <i class="fa-solid fa-list-ol text-hospital-accent"></i>
                    <span>قائمة الانتظار</span>
                </h2>
                <span id="display-queue-count" class="text-xs font-bold text-hospital-darkBlue bg-hospital-accent px-3 py-1 rounded-full">0</span>
            </div>

            <div id="display-queue-list" class="space-y-3 overflow-y-auto max-h-[350px] pr-1 flex-grow">
            </div>

            <div id="display-empty-msg" class="text-center py-12 text-slate-400 font-bold text-sm">
                لا يوجد منتظرين حالياً
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-hospital-blue border-t-2 border-hospital-accent/30 py-3 px-6 rounded-2xl text-center text-xs font-bold text-amber-200 shadow-lg">
        <p>المملكة العربية السعودية - وزارة الصحة © نظام إدارة الطوابير الآلي</p>
    </footer>

    <!-- Display Logic & Firebase -->
    <script>
        setInterval(() => {
            try {
                const now = new Date();
                const clockEl = document.getElementById('live-clock');
                const dateEl = document.getElementById('live-date');
                
                if(clockEl) {
                    let hours = now.getHours();
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const seconds = String(now.getSeconds()).padStart(2, '0');
                    const ampm = hours >= 12 ? 'م' : 'ص';
                    hours = hours % 12 || 12;
                    clockEl.textContent = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
                }
                if(dateEl) {
                    dateEl.textContent = now.toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                }
            } catch (e) {}
        }, 1000);

        let state = { queue: [], current: null, nextId: 1 };
        let lastAnnouncedId = null;

        function announceCurrent() {
            if (state && state.current && state.current.id) {
                if (lastAnnouncedId !== state.current.id) {
                    lastAnnouncedId = state.current.id;
                    try {
                        if ('speechSynthesis' in window) {
                            window.speechSynthesis.cancel();
                            const msg = new SpeechSynthesisUtterance(`رقم المراجع ${state.current.id}`);
                            msg.lang = 'ar-SA';
                            msg.rate = 0.9;
                            window.speechSynthesis.speak(msg);
                        }
                    } catch (e) {}
                }
            }
        }

        window.renderDisplay = function() {
            try {
                const currentNumEl = document.getElementById('display-current-num');
                const queueListEl = document.getElementById('display-queue-list');
                const queueCountEl = document.getElementById('display-queue-count');
                const emptyMsgEl = document.getElementById('display-empty-msg');

                const currentStr = (state && state.current && state.current.id) ? String(state.current.id).padStart(3, '0') : '000';
                if (currentNumEl) currentNumEl.textContent = currentStr;
                if (queueCountEl) queueCountEl.textContent = state && state.queue ? state.queue.length : 0;

                if (queueListEl) {
                    queueListEl.innerHTML = '';
                    if (!state || !state.queue || state.queue.length === 0) {
                        if (emptyMsgEl) emptyMsgEl.classList.remove('hidden');
                    } else {
                        if (emptyMsgEl) emptyMsgEl.classList.add('hidden');
                        state.queue.forEach((patient) => {
                            const item = document.createElement('div');
                            item.className = "bg-hospital-darkBlue border border-hospital-accent/30 rounded-2xl p-3.5 text-center shadow-md flex items-center justify-between px-6";
                            item.innerHTML = `
                                <span class="text-2xl font-black text-white">${String(patient.id).padStart(3, '0')}</span>
                                <span class="text-xs text-amber-200 font-bold bg-amber-200/10 px-3 py-1 rounded-full border border-amber-200/20">قيد الانتظار</span>
                            `;
                            queueListEl.appendChild(item);
                        });
                    }
                }
            } catch (e) {}
        }

        window.addEventListener('load', () => {
            renderDisplay();
        });
    </script>

    <!-- Firebase Sync -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtLu7ICGKWJDHIuPBM4h1cZmkDsxjylxo",
            authDomain: "hospital-ba989.firebaseapp.com",
            projectId: "hospital-ba989",
            storageBucket: "hospital-ba989.firebasestorage.app",
            messagingSenderId: "30608387919",
            appId: "1:30608387919:web:ee0f83efabc514e5ff1f3a",
            measurementId: "G-6R34PWFVWK"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);
            signInAnonymously(auth).catch(() => {});

            const docRef = doc(db, "queues", "hospital_main_queue");
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (cloudData && cloudData.state) {
                        state = cloudData.state; // تم تحديث المتغير المحلي مباشرة هنا لضمان مزامنة الشاشة
                        if (cloudData.shouldAnnounce) {
                            announceCurrent();
                        }
                        if (typeof window.renderDisplay === 'function') {
                            window.renderDisplay();
                        }
                    }
                }
            }, () => {});
        } catch (e) {}
    </script>
</body>
</html>
