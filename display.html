<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الانتظار - مستشفى الملك فيصل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        saudi: {
                            green: '#006C35',
                            darkGreen: '#004B25',
                            emerald: '#0B4B28',
                            lightGreen: '#008743',
                            gold: '#D4AF37',
                            lightGold: '#F3E5AB',
                            darkGold: '#A38128',
                            sand: '#FBF9F5',
                            slate: '#1E293B'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'Tajawal', 'sans-serif'],
                        tajawal: ['Tajawal', 'Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: #F8F6F0;
            overflow-x: hidden;
        }
        .saudi-pattern-bg {
            background-color: #F8F6F0;
            background-image: radial-gradient(#006C35 0.75px, transparent 0.75px), radial-gradient(#D4AF37 0.75px, #F8F6F0 0.75px);
            background-size: 35px 35px;
            background-position: 0 0, 17.5px 17.5px;
        }
        .emerald-card-shadow {
            box-shadow: 0 20px 50px -10px rgba(0, 108, 53, 0.15);
        }
        .call-flash {
            animation: flashGolden 1s ease-in-out 3;
        }
        @keyframes flashGolden {
            0%, 100% { background-color: rgba(255, 255, 255, 1); }
            50% { background-color: rgba(243, 229, 171, 0.7); }
        }
    </style>
</head>
<body class="saudi-pattern-bg text-slate-800 min-h-screen flex flex-col justify-between" onclick="initAudioContext()">

    <!-- Top Bar -->
    <header class="bg-saudi-emerald text-white border-b-4 border-saudi-gold shadow-2xl py-4 px-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="w-16 h-16 rounded-2xl bg-saudi-darkGreen border-2 border-saudi-gold flex items-center justify-center p-3 text-saudi-gold shadow-lg shrink-0">
                    <svg class="w-full h-full fill-saudi-gold" viewBox="0 0 100 100">
                        <path d="M50,15 C52,25 58,32 68,36 C58,38 53,42 52,50 C48,50 43,42 33,36 C43,32 48,25 50,15 Z" />
                        <path d="M47,48 L53,48 L53,82 L47,82 Z" />
                        <path d="M20,78 Q50,70 80,55 L75,50 Q48,64 22,70 Z" />
                        <path d="M80,78 Q50,70 20,55 L25,50 Q52,64 78,70 Z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-white tracking-wide font-tajawal">مستشفى الملك فيصل</h1>
                    <p class="text-sm text-saudi-lightGold font-semibold">صالة انتظار المراجعين الرئيسية</p>
                </div>
            </div>
            <div class="text-left bg-saudi-darkGreen/50 px-6 py-3 rounded-2xl border border-saudi-gold/40">
                <div id="live-clock" class="text-2xl font-black text-saudi-gold tracking-widest">00:00:00</div>
                <div id="live-date" class="text-xs text-saudi-lightGold font-bold mt-0.5">--/--/----</div>
            </div>
        </div>
    </header>

    <!-- Main Display Area -->
    <main class="max-w-7xl w-full mx-auto px-6 py-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

        <!-- Current Serving Display Box -->
        <div id="lounge-card-container" class="lg:col-span-7 bg-white rounded-3xl p-10 border-4 border-saudi-gold/50 emerald-card-shadow text-center space-y-6 relative overflow-hidden transition-all duration-300">
            <div class="absolute top-0 right-0 left-0 h-3 bg-gradient-to-r from-saudi-green via-saudi-gold to-saudi-green"></div>
            
            <div class="text-slate-600 font-black text-2xl sm:text-3xl mb-2 flex items-center justify-center gap-3">
                <i class="fa-solid fa-bell text-saudi-gold animate-bounce"></i>
                <span>الرقم الحالي</span>
            </div>

            <div class="py-4">
                <div id="display-current-num" class="text-9xl sm:text-[12rem] font-black text-saudi-green tracking-tighter my-4 py-8 bg-saudi-sand/90 rounded-3xl border-2 border-saudi-gold/40 shadow-inner">---</div>
            </div>

            <div class="bg-saudi-emerald text-saudi-lightGold p-4 rounded-2xl border border-saudi-gold/50 text-xl sm:text-2xl font-black shadow-md flex items-center justify-center gap-3 max-w-xl mx-auto">
                <i class="fa-solid fa-stethoscope text-saudi-gold"></i>
                <span>الرجاء التوجه للعيادة</span>
            </div>
        </div>

        <!-- Next Queue List (Right Side) -->
        <div class="lg:col-span-5 bg-white rounded-3xl p-6 border-2 border-slate-200/80 emerald-card-shadow flex flex-col h-[500px]">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-full bg-saudi-gold"></div>
                    <h2 class="text-xl font-black text-saudi-darkGreen">قائمة الانتظار القادمة</h2>
                </div>
                <span id="display-queue-counter" class="text-xs font-bold text-saudi-green bg-saudi-green/10 border border-saudi-green/20 px-3 py-1 rounded-full">0 مراجعين</span>
            </div>

            <div class="overflow-y-auto flex-grow space-y-3 pr-1" id="display-queue-list">
                <!-- Dynamic Queue Items will be injected here -->
            </div>

            <div id="display-empty-msg" class="text-center py-20 text-slate-400 font-bold hidden">
                <i class="fa-solid fa-clipboard-check text-4xl text-slate-300 mb-2 block"></i>
                لا يوجد مراجعين في الانتظار حالياً
            </div>
        </div>

    </main>

    <!-- Footer Banner -->
    <footer class="bg-saudi-darkGreen text-saudi-lightGold py-4 border-t border-saudi-gold/30 text-center text-sm font-bold">
        <p>نعمل لخدمتكم دائماً - وزارة الصحة © المملكة العربية السعودية</p>
    </footer>

    <!-- Audio Engine & Sync -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let audioCtx = null;

        window.initAudioContext = function() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        };

        let state = {
            queue: [],
            current: null
        };

        let lastAnnouncedId = null;

        // Live Clock
        setInterval(() => {
            const now = new Date();
            const clockEl = document.getElementById('live-clock');
            const dateEl = document.getElementById('live-date');
            if(clockEl) clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: false });
            if(dateEl) dateEl.textContent = now.toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        try {
            const localSaved = localStorage.getItem('kfh_queue_state');
            if (localSaved) {
                const parsed = JSON.parse(localSaved);
                if (parsed && parsed.state) {
                    state = parsed.state;
                    if(state.current) lastAnnouncedId = state.current.id;
                }
            }
        } catch (e) {}

        const firebaseConfig = {
            apiKey: "AIzaSyBtLu7ICGKWJDHIuPBM4h1cZmkDsxjylxo",
            authDomain: "hospital-ba989.firebaseapp.com",
            projectId: "hospital-ba989",
            storageBucket: "hospital-ba989.firebasestorage.app",
            messagingSenderId: "30608387919",
            appId: "1:30608387919:web:ee0f83efabc514e5ff1f3a",
            measurementId: "G-6R34PWFVWK"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);
            signInAnonymously(auth).catch(() => {});

            const docRef = doc(db, "queues", "hospital_main_queue");
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (cloudData && cloudData.state) {
                        state = cloudData.state;
                        const shouldAnnounce = cloudData.shouldAnnounce;

                        if (state.current && state.current.id !== lastAnnouncedId) {
                            lastAnnouncedId = state.current.id;
                            playChimeAndSpeak(state.current.id);
                            flashLoungeDisplay();
                        } else if (shouldAnnounce && state.current && state.current.id === lastAnnouncedId) {
                            playChimeAndSpeak(state.current.id);
                            flashLoungeDisplay();
                        }

                        renderDisplay();
                    }
                }
            }, () => {});
        } catch (e) {}

        const queueChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('kfh_queue_sync') : null;
        if (queueChannel) {
            queueChannel.onmessage = (event) => {
                if (event.data && event.data.state) {
                    state = event.data.state;
                    const shouldAnnounce = event.data.shouldAnnounce;

                    if (state.current && (state.current.id !== lastAnnouncedId || shouldAnnounce)) {
                        lastAnnouncedId = state.current.id;
                        playChimeAndSpeak(state.current.id);
                        flashLoungeDisplay();
                    }

                    renderDisplay();
                }
            };
        }

        function playChimeAndSpeak(ticketNumber) {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const freqs = [659.25, 880, 1318.51];
                freqs.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.15));
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + (idx * 0.15));
                    gain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + (idx * 0.15) + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.15) + 0.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.15));
                    osc.stop(audioCtx.currentTime + (idx * 0.15) + 0.8);
                });

                setTimeout(() => {
                    if ('speechSynthesis' in window) {
                        const formattedNum = String(ticketNumber);
                        const text = `الرقم ${formattedNum}، الرجاء التوجه إلى الاستقبال`;
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'ar-SA';
                        utterance.rate = 0.9;
                        window.speechSynthesis.speak(utterance);
                    }
                }, 1000);
            } catch (e) {}
        }

        function flashLoungeDisplay() {
            const loungeCard = document.getElementById('lounge-card-container');
            if (loungeCard) {
                loungeCard.classList.add('call-flash');
                setTimeout(() => loungeCard.classList.remove('call-flash'), 3000);
            }
        }

        function renderDisplay() {
            const currentNumEl = document.getElementById('display-current-num');
            const queueListEl = document.getElementById('display-queue-list');
            const queueCounterEl = document.getElementById('display-queue-counter');
            const emptyMsgEl = document.getElementById('display-empty-msg');

            const currentStr = state.current ? String(state.current.id).padStart(3, '0') : '---';
            if (currentNumEl) currentNumEl.textContent = currentStr;
            if (queueCounterEl) queueCounterEl.textContent = `${state.queue.length} مراجعين`;

            if (queueListEl) {
                queueListEl.innerHTML = '';
                if (state.queue.length === 0) {
                    if (emptyMsgEl) emptyMsgEl.classList.remove('hidden');
                } else {
                    if (emptyMsgEl) emptyMsgEl.classList.add('hidden');
                    state.queue.forEach((patient, idx) => {
                        const div = document.createElement('div');
                        div.className = "flex items-center justify-between p-4 rounded-2xl bg-slate-50 border border-slate-200/60 shadow-sm";
                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 rounded-xl bg-saudi-green/10 text-saudi-green font-black text-xs flex items-center justify-center">${idx + 1}</span>
                                <span class="font-bold text-slate-700 text-base">${patient.name || 'مراجع بدون اسم'}</span>
                            </div>
                            <span class="text-2xl font-black text-saudi-darkGreen">${String(patient.id).padStart(3, '0')}</span>
                        `;
                        queueListEl.appendChild(div);
                    });
                }
            }
        }

        renderDisplay();
    </script>
</body>
</html>
