        let audioCtx = null;

        window.initAudioContext = function() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        };

            if(dateEl) dateEl.textContent = now.toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

            const localSaved = localStorage.getItem('kfh_queue_state');

                    if(state.current) lastAnnouncedId = state.current.id;
