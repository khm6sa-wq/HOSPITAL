<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة رقم 1 - مستشفى الملك فيصل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; overflow-x: hidden; transition: all 0.3s ease; }

        /* الثيمات الـ 10 بدرجات السماوي والأبيض */
        body.theme-sky { background-color: #F0F9FF; color: #0F172A; }
        body.theme-sky .top-bar-custom { background-color: #0369A1; color: #E0F2FE; }
        body.theme-sky header.main-header { background-color: #0284C7; color: white; border-bottom: 4px solid #38BDF8; }

        body.theme-deep { background-color: #E0F2FE; color: #0C4A6E; }
        body.theme-deep .top-bar-custom { background-color: #0C4A6E; color: #BAE6FD; }
        body.theme-deep header.main-header { background-color: #0369A1; color: white; border-bottom: 4px solid #0284C7; }

        body.theme-glass { background: linear-gradient(135deg, #F8FAFC 0%, #E0F2FE 100%); color: #1E293B; }
        body.theme-glass .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-glass header.main-header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); color: #0284C7; border-bottom: 4px solid #7DD3FC; }

        body.theme-azure { background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%); color: #0369A1; }
        body.theme-azure .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-azure header.main-header { background-color: #FFFFFF; color: #0284C7; border-bottom: 4px solid #38BDF8; }

        body.theme-cloud { background-color: #FFFFFF; color: #0F172A; }
        body.theme-cloud .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-cloud header.main-header { background-color: #F0F9FF; color: #0284C7; border-bottom: 4px solid #0284C7; }

        body.theme-crystal { background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); color: #0C4A6E; }
        body.theme-crystal .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-crystal header.main-header { background-color: rgba(255, 255, 255, 0.95); color: #0284C7; border-bottom: 4px solid #38BDF8; }

        body.theme-royal { background-color: #F8FAFC; color: #0F172A; }
        body.theme-royal .top-bar-custom { background-color: #0369A1; color: #E0F2FE; }
        body.theme-royal header.main-header { background-color: #0284C7; color: white; border-bottom: 4px solid #0369A1; }

        body.theme-cotton { background-color: #E0F2FE; color: #0369A1; }
        body.theme-cotton .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-cotton header.main-header { background-color: #FFFFFF; color: #0284C7; border-bottom: 4px solid #7DD3FC; }

        body.theme-mist { background: radial-gradient(circle, #F0F9FF 0%, #BAE6FD 100%); color: #0C4A6E; }
        body.theme-mist .top-bar-custom { background-color: #0369A1; color: white; }
        body.theme-mist header.main-header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); color: #0369A1; border-bottom: 4px solid #38BDF8; }

        body.theme-diamond { background-color: #FFFFFF; color: #0369A1; }
        body.theme-diamond .top-bar-custom { background-color: #0284C7; color: #F0F9FF; }
        body.theme-diamond header.main-header { background-color: #F8FAFC; color: #0284C7; border-bottom: 4px solid #38BDF8; }

        .pattern-bg {
            background-image: radial-gradient(#38BDF8 0.6px, transparent 0.6px), radial-gradient(#0284C7 0.6px, #F0F9FF 0.6px);
            background-size: 30px 30px;
        }
        .card-shadow { box-shadow: 0 20px 40px -10px rgba(2, 132, 199, 0.12); }
    </style>
</head>
<body class="theme-sky pattern-bg min-h-screen flex flex-col justify-between">

    <!-- Top Bar -->
    <div class="top-bar-custom py-2 px-6 text-xs font-bold shadow-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-stethoscope"></i>
                <span>مستشفى الملك فيصل | عيادة رقم 1</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5">
                    <span class="text-[11px]">الثيم:</span>
                    <select id="theme-selector" onchange="changeTheme(this.value)" class="bg-white text-slate-900 text-xs font-bold px-2 py-0.5 rounded-lg border border-sky-300 outline-none">
                        <option value="theme-sky">سماوي ناصع</option>
                        <option value="theme-deep">سماوي عميق</option>
                        <option value="theme-glass">زجاجي أبيض</option>
                        <option value="theme-azure">سماوي هادئ</option>
                        <option value="theme-cloud">أبيض سحابي</option>
                        <option value="theme-crystal">سماوي بلوري</option>
                        <option value="theme-royal">سماوي ملكي</option>
                        <option value="theme-cotton">سماوي قطني</option>
                        <option value="theme-mist">سماوي ضبابي</option>
                        <option value="theme-diamond">أبيض ماسي</option>
                    </select>
                </div>
                <div id="live-clock">00:00:00 ص</div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="main-header shadow-2xl py-4 px-8 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <img id="hospital-logo-img" src="https://via.placeholder.com/60" alt="شعار المستشفى" class="w-12 h-12 rounded-2xl object-cover border-2 border-white shadow-md bg-white">
                <div>
                    <h1 class="text-xl font-bold font-amiri">عيادة الطبيب - رقم 1</h1>
                    <span class="text-xs opacity-90">نظام إدارة الطوابير الآلي</span>
                </div>
            </div>
            <div class="bg-sky-900/30 px-4 py-2 rounded-xl text-xs font-bold border border-white/30">
                المراجعين بالانتظار: <span id="waiting-count" class="text-sky-200 text-base">0</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto px-6 py-10 flex-grow flex flex-col justify-center space-y-6">
        <div class="bg-white rounded-3xl p-8 sm:p-10 border-4 border-emerald-400 card-shadow text-center space-y-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 left-0 h-3 bg-emerald-500"></div>
            
            <div class="text-emerald-900 font-black text-2xl">
                الرقم الحالي تحت الخدمة في عيادة 1
            </div>

            <div id="clinic1-current" class="text-8xl sm:text-[10rem] font-black text-emerald-900 tracking-tighter py-6 bg-emerald-50 rounded-3xl border-2 border-emerald-200 shadow-inner">
                ---
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <button onclick="callNextForClinic1()" class="bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-2xl font-black text-lg shadow-lg transition-all flex items-center justify-center gap-3 cursor-pointer border border-emerald-400">
                    <i class="fa-solid fa-bullhorn text-emerald-200 text-xl"></i>
                    <span>نداء المراجع التالي 📢</span>
                </button>

                <button onclick="recallClinic1()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-900 p-4 rounded-2xl font-black text-base shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer border border-emerald-200">
                    <i class="fa-solid fa-rotate-right text-emerald-600"></i>
                    <span>إعادة النداء 🔄</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="top-bar-custom py-3 text-center text-xs font-bold shadow-inner">
        <p>التجمع الصحي © المملكة العربية السعودية - عيادة رقم 1</p>
    </footer>

    <script>
        window.changeTheme = function(themeName) {
            document.body.className = themeName + " pattern-bg min-h-screen flex flex-col justify-between";
            localStorage.setItem('kfh_theme', themeName);
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('kfh_theme');
            if (savedTheme) {
                document.body.className = savedTheme + " pattern-bg min-h-screen flex flex-col justify-between";
                const sel = document.getElementById('theme-selector');
                if(sel) sel.value = savedTheme;
            }
            const savedLogo = localStorage.getItem('kfh_custom_logo');
            if (savedLogo) {
                document.getElementById('hospital-logo-img').src = savedLogo;
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'kfh_theme' && event.newValue) {
                document.body.className = event.newValue + " pattern-bg min-h-screen flex flex-col justify-between";
                const sel = document.getElementById('theme-selector');
                if(sel) sel.value = event.newValue;
            }
            if (event.key === 'kfh_custom_logo' && event.newValue) {
                document.getElementById('hospital-logo-img').src = event.newValue;
            }
        });

        setInterval(() => {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12 || 12;
            document.getElementById('live-clock').textContent = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        }, 1000);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtLu7ICGKWJDHIuPBM4h1cZmkDsxjylxo",
            authDomain: "hospital-ba989.firebaseapp.com",
            projectId: "hospital-ba989",
            storageBucket: "hospital-ba989.firebasestorage.app",
            messagingSenderId: "30608387919",
            appId: "1:30608387919:web:ee0f83efabc514e5ff1f3a",
            measurementId: "G-6R34PWFVWK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        signInAnonymously(auth).catch(() => {});
        const mainDocRef = doc(db, "queues", "hospital_main_queue");

        let currentState = { queue: [], clinic1: null, clinic2: null, nextId: 1 };

        window.callNextForClinic1 = async function() {
            if (!currentState.queue || currentState.queue.length === 0) {
                alert('لا يوجد مراجعين في قائمة الانتظار حالياً');
                return;
            }
            const nextPatient = currentState.queue.shift();
            currentState.clinic1 = nextPatient;

            try {
                await setDoc(mainDocRef, {
                    state: currentState,
                    shouldAnnounce: true,
                    announceClinic: 1,
                    announceTicket: nextPatient.id,
                    timestamp: Date.now()
                });
            } catch(e) {}
        };

        window.recallClinic1 = async function() {
            if (!currentState.clinic1) {
                alert('لا يوجد مراجع حالي لإعادة ندائه في عيادة 1');
                return;
            }
            try {
                await setDoc(mainDocRef, {
                    state: currentState,
                    shouldAnnounce: true,
                    announceClinic: 1,
                    announceTicket: currentState.clinic1.id,
                    timestamp: Date.now()
                });
            } catch(e) {}
        };

        onSnapshot(mainDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data && data.state) {
                    currentState = data.state;
                    try { localStorage.setItem('kfh_queue_state', JSON.stringify({ state: currentState })); } catch(e) {}
                    
                    const c1El = document.getElementById('clinic1-current');
                    const countEl = document.getElementById('waiting-count');

                    if (c1El) {
                        c1El.textContent = (currentState.clinic1 && currentState.clinic1.id) ? String(currentState.clinic1.id).padStart(3, '0') : '---';
                    }
                    if (countEl) {
                        countEl.textContent = currentState.queue ? currentState.queue.length : 0;
                    }
                }
            }
        });
    </script>
</body>
</html>
