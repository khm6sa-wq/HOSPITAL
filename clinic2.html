<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى الملك فيصل - عيادة 2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; overflow-x: hidden; transition: all 0.3s ease; }

        /* الثيمات الـ 10 بدرجات السماوي والأبيض */
        body.theme-sky { background-color: #F0F9FF; color: #0F172A; }
        body.theme-sky .top-bar-custom { background-color: #0369A1; color: #E0F2FE; }
        body.theme-sky header.main-header { background-color: #0284C7; color: white; border-bottom: 4px solid #38BDF8; }

        body.theme-deep { background-color: #E0F2FE; color: #0C4A6E; }
        body.theme-deep .top-bar-custom { background-color: #0C4A6E; color: #BAE6FD; }
        body.theme-deep header.main-header { background-color: #0369A1; color: white; border-bottom: 4px solid #0284C7; }

        body.theme-glass { background: linear-gradient(135deg, #F8FAFC 0%, #E0F2FE 100%); color: #1E293B; }
        body.theme-glass .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-glass header.main-header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); color: #0284C7; border-bottom: 4px solid #7DD3FC; }

        body.theme-azure { background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%); color: #0369A1; }
        body.theme-azure .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-azure header.main-header { background-color: #FFFFFF; color: #0284C7; border-bottom: 4px solid #38BDF8; }

        body.theme-cloud { background-color: #FFFFFF; color: #0F172A; }
        body.theme-cloud .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-cloud header.main-header { background-color: #F0F9FF; color: #0284C7; border-bottom: 4px solid #0284C7; }

        body.theme-crystal { background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); color: #0C4A6E; }
        body.theme-crystal .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-crystal header.main-header { background-color: rgba(255, 255, 255, 0.95); color: #0284C7; border-bottom: 4px solid #38BDF8; }

        body.theme-royal { background-color: #F8FAFC; color: #0F172A; }
        body.theme-royal .top-bar-custom { background-color: #0369A1; color: #E0F2FE; }
        body.theme-royal header.main-header { background-color: #0284C7; color: white; border-bottom: 4px solid #0369A1; }

        body.theme-cotton { background-color: #E0F2FE; color: #0369A1; }
        body.theme-cotton .top-bar-custom { background-color: #0284C7; color: white; }
        body.theme-cotton header.main-header { background-color: #FFFFFF; color: #0284C7; border-bottom: 4px solid #7DD3FC; }

        body.theme-mist { background: radial-gradient(circle, #F0F9FF 0%, #BAE6FD 100%); color: #0C4A6E; }
        body.theme-mist .top-bar-custom { background-color: #0369A1; color: white; }
        body.theme-mist header.main-header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); color: #0369A1; border-bottom: 4px solid #38BDF8; }

        body.theme-diamond { background-color: #FFFFFF; color: #0369A1; }
        body.theme-diamond .top-bar-custom { background-color: #0284C7; color: #F0F9FF; }
        body.theme-diamond header.main-header { background-color: #F8FAFC; color: #0284C7; border-bottom: 4px solid #38BDF8; }

        .pattern-bg { 
            background-image: radial-gradient(#38BDF8 0.6px, transparent 0.6px), radial-gradient(#0284C7 0.6px, #F8FAFC 0.6px); 
            background-size: 30px 30px; 
        }
        .card-shadow { box-shadow: 0 20px 40px -10px rgba(2, 132, 199, 0.12); }
    </style>
</head>
<body class="theme-sky pattern-bg min-h-screen flex flex-col justify-between">
    
    <!-- Top Bar -->
    <div class="top-bar-custom py-2 px-6 text-xs font-bold shadow-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <i class="fa-solid fa-hospital"></i>
                <span>التجمع الصحي | عيادة 2 - لوحة الطبيب</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[11px]">الثيم:</span>
                <select id="theme-selector" onchange="changeTheme(this.value)" class="bg-white text-slate-900 text-xs font-bold px-2 py-0.5 rounded-lg border border-sky-300 outline-none">
                    <option value="theme-sky">سماوي ناصع</option>
                    <option value="theme-deep">سماوي عميق</option>
                    <option value="theme-glass">زجاجي أبيض</option>
                    <option value="theme-azure">سماوي هادئ</option>
                    <option value="theme-cloud">أبيض سحابي</option>
                    <option value="theme-crystal">سماوي بلوري</option>
                    <option value="theme-royal">سماوي ملكي</option>
                    <option value="theme-cotton">سماوي قطني</option>
                    <option value="theme-mist">سماوي ضبابي</option>
                    <option value="theme-diamond">أبيض ماسي</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="main-header shadow-2xl py-4 px-8 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4 space-x-reverse">
                <img id="clinic-logo-img" src="https://via.placeholder.com/60" alt="شعار المستشفى" class="w-14 h-14 rounded-2xl object-cover border-2 border-white shadow-md bg-white">
                <div class="flex flex-col justify-center">
                    <h1 class="text-2xl sm:text-3xl font-bold font-amiri tracking-tight">مُسْتَشْفَى المَلِك فَيْصَل</h1>
                    <span class="text-xs sm:text-sm font-semibold opacity-90 mt-0.5">عيادة 2 - لوحة التحكم الطبية</span>
                </div>
            </div>
            <a href="index.html" target="_blank" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl text-xs font-bold transition border border-white/30">
                <i class="fa-solid fa-house ml-1"></i> الاستقبال
            </a>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-6 py-8 flex-grow grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- لوحة عرض المريض الحالي -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 border-4 border-sky-300 card-shadow text-center space-y-6 flex flex-col justify-between">
            <div>
                <div class="text-sky-900 font-black text-lg mb-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-doctor text-sky-600"></i>
                    <span>المراجع قيد الخدمة حالياً</span>
                </div>
                <div id="current-patient-num" class="text-8xl sm:text-9xl font-black text-sky-900 tracking-tighter py-6 bg-sky-50 rounded-3xl border-2 border-sky-200 shadow-inner">
                    ---
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="callNextPatient()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-black py-4 px-6 rounded-2xl shadow-lg transition-all text-lg cursor-pointer border border-sky-400 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-bullhorn text-sky-200 text-xl"></i>
                    <span>النداء على التالي 📢</span>
                </button>
            </div>
        </div>

        <!-- قائمة الانتظار الحالية -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 border-2 border-sky-200 card-shadow flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-3 border-b border-sky-100 mb-4">
                    <span class="font-black text-sky-900 text-sm">قائمة الانتظار العامة</span>
                    <span id="queue-counter" class="text-xs font-bold text-sky-800 bg-sky-100 px-3 py-1 rounded-full">0 مراجعين</span>
                </div>
                <div id="queue-list" class="space-y-2 max-h-64 overflow-y-auto p-1">
                    <div class="text-center text-slate-400 text-xs py-4">لا يوجد مراجعين بالانتظار</div>
                </div>
            </div>
            <div class="text-center text-[11px] text-slate-500 font-bold mt-4 pt-3 border-t border-sky-100">
                نظام إدارة الطوابير الآلي - عيادة 2
            </div>
        </div>
    </main>

    <footer class="top-bar-custom py-4 text-center text-sm font-bold shadow-lg">
        <p>التجمع الصحي © المملكة العربية السعودية - نظام إدارة الطوابير</p>
    </footer>

    <!-- Script الثيمات والشعار -->
    <script>
        window.changeTheme = function(themeName) {
            document.body.className = themeName + " pattern-bg min-h-screen flex flex-col justify-between";
            localStorage.setItem('kfh_theme', themeName);
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('kfh_theme');
            if (savedTheme) {
                document.body.className = savedTheme + " pattern-bg min-h-screen flex flex-col justify-between";
                document.getElementById('theme-selector').value = savedTheme;
            }
            const savedLogo = localStorage.getItem('kfh_custom_logo');
            if (savedLogo) {
                document.getElementById('clinic-logo-img').src = savedLogo;
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'kfh_theme' && event.newValue) {
                document.body.className = event.newValue + " pattern-bg min-h-screen flex flex-col justify-between";
                document.getElementById('theme-selector').value = event.newValue;
            }
            if (event.key === 'kfh_custom_logo' && event.newValue) {
                document.getElementById('clinic-logo-img').src = event.newValue;
            }
        });
    </script>

    <!-- Firebase & Safe Transaction Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, runTransaction, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtLu7ICGKWJDHIuPBM4h1cZmkDsxjylxo",
            authDomain: "hospital-ba989.firebaseapp.com",
            projectId: "hospital-ba989",
            storageBucket: "hospital-ba989.firebasestorage.app",
            messagingSenderId: "30608387919",
            appId: "1:30608387919:web:ee0f83efabc514e5ff1f3a",
            measurementId: "G-6R34PWFVWK"
        };

        let db, mainDocRef;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            const auth = getAuth(app);
            signInAnonymously(auth).catch(() => {});
            mainDocRef = doc(db, "queues", "hospital_main_queue");

            // دالة النداء الآمنة باستخدام المعاملات الذرية لمنع أي تراجع للخلف
            window.callNextPatient = async function() {
                try {
                    await runTransaction(db, async (transaction) => {
                        const docSnap = await transaction.get(mainDocRef);
                        let state = { queue: [], clinic1: null, clinic2: null, nextId: 1 };
                        if (docSnap.exists() && docSnap.data().state) {
                            state = docSnap.data().state;
                        }

                        if (!state.queue || state.queue.length === 0) {
                            alert('لا يوجد مراجعين في الانتظار حالياً.');
                            return;
                        }

                        const nextPatient = state.queue.shift();
                        state.clinic2 = nextPatient; // مخصص لعيادة 2

                        transaction.set(mainDocRef, { 
                            state, 
                            shouldAnnounce: true, 
                            announcementText: `المراجع رقم ${nextPatient.id} إلى عيادة 2`,
                            timestamp: Date.now() 
                        });
                    });
                } catch (e) {
                    alert('حدث خطأ أثناء الاتصال بالنظام، يرجى المحاولة مرة أخرى.');
                }
            };

            onSnapshot(mainDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (cloudData && cloudData.state) {
                        const state = cloudData.state;
                        
                        // تحديث واجهة عيادة 2
                        const currentEl = document.getElementById('current-patient-num');
                        if (currentEl) {
                            currentEl.textContent = (state.clinic2 && state.clinic2.id) ? String(state.clinic2.id).padStart(3, '0') : '---';
                        }

                        // تحديث القائمة
                        const listEl = document.getElementById('queue-list');
                        const counterEl = document.getElementById('queue-counter');
                        if (counterEl) counterEl.textContent = `${state.queue ? state.queue.length : 0} مراجعين`;
                        
                        if (listEl) {
                            listEl.innerHTML = '';
                            if (!state.queue || state.queue.length === 0) {
                                listEl.innerHTML = '<div class="text-center text-slate-400 text-xs py-4">لا يوجد مراجعين بالانتظار</div>';
                            } else {
                                state.queue.forEach(p => {
                                    const div = document.createElement('div');
                                    div.className = "bg-sky-50 border border-sky-200 rounded-xl p-2.5 flex items-center justify-between";
                                    div.innerHTML = `<span class="text-sm font-black text-sky-900">${String(p.id).padStart(3, '0')}</span><span class="text-[10px] text-slate-500 font-bold">انتظار</span>`;
                                    listEl.appendChild(div);
                                });
                            }
                        }
                    }
                }
            });
        } catch (e) {}
    </script>
</body>
</html>
